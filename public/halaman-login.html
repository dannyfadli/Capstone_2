  <script>
    // Minimal vanilla JS: password show/hide toggle for both layouts.
    (function () {
      var toggles = document.querySelectorAll('.password-toggle');

      toggles.forEach(function (toggle) {
        toggle.addEventListener('click', function () {
          var targetId = toggle.getAttribute('data-target');
          var input = document.getElementById(targetId);
          if (!input) return;

          var isPassword = input.getAttribute('type') === 'password';
          input.setAttribute('type', isPassword ? 'text' : 'password');
          toggle.setAttribute('aria-pressed', String(isPassword));
          toggle.setAttribute(
            'aria-label',
            isPassword ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'
          );

          var icon = toggle.querySelector('img');
          if (icon) {
            icon.style.transition = 'transform 150ms ease';
            icon.style.transform = 'scale(0.8)';
            window.requestAnimationFrame(function () {
              icon.style.transform = 'scale(1)';
            });
          }
        });
      });
    })();

    // Navigate to Halaman Beranda after a successful login.
    // The target file is expected to sit next to this one
    // (e.g. both downloaded into the same folder).
    (function () {
      var BERANDA_URL = 'halaman-beranda.html';

      var forms = [
        document.getElementById('loginFormDesktop'),
        document.getElementById('loginFormMobile')
      ];

      forms.forEach(function (form) {
        if (!form) return;

        form.addEventListener('submit', function (event) {
          event.preventDefault();

          var submitBtn = form.querySelector('button[type="submit"]');
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';
            submitBtn.style.cursor = 'progress';
          }

          // In a real app this is where you'd validate credentials
          // against a server before redirecting.
          window.location.href = BERANDA_URL;
        });
      });
    })();
  </script>
